name: Wiki quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check wiki structure and links
        run: python scripts/check_wiki.py
